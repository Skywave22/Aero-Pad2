<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AeroPad — 40 Distinct UI/UX Layouts (Portrait + Landscape)</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  header { max-width:1440px; margin:0 auto 20px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; }
  header h1 { font-size:22px; font-weight:700; }
  header p { font-size:13px; color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:8px; }
  .filter-btn { border:1px solid var(--border); background:var(--card); color:var(--text); padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; }
  .filter-btn.active { background:#111827; color:#fff; border-color:#111827; }
  .grid { max-width:1440px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(580px,1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .title { font-size:14px; font-weight:700; }
  .meta { font-size:11px; color:var(--muted); }
  .stage { display:flex; align-items:center; justify-content:space-between; gap:14px; background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:14px; overflow-x:auto; }
  .p-frame { width:160px; height:300px; border-radius:20px; border:3px solid #1f2937; padding:8px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; font-size:8.5px; overflow:hidden; }
  .l-frame { width:330px; height:172px; border-radius:18px; border:3px solid #1f2937; padding:8px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; font-size:8.5px; overflow:hidden; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:3px 6px; border-radius:6px; font-weight:600; font-size:8px; }
  .pill { padding:2px 6px; border-radius:999px; font-size:7px; font-weight:700; }
  .row { display:flex; gap:4px; align-items:stretch; }
  .col { display:flex; flex-direction:column; gap:4px; }
  .box { border-radius:8px; padding:5px; border:1px solid rgba(128,128,128,0.24); display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; }
  .pad { flex:1; border-radius:10px; position:relative; border:1px solid rgba(128,128,128,0.25); display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:600; }
  .dot { width:12px; height:12px; border-radius:50%; position:absolute; opacity:0.8; }
  .vs { position:absolute; right:4px; top:14%; bottom:14%; width:4px; border-radius:4px; opacity:0.5; }
  .hs { position:absolute; bottom:4px; left:14%; right:14%; height:4px; border-radius:4px; opacity:0.5; }
  .nav { display:flex; justify-content:space-around; padding-top:3px; border-top:1px solid rgba(128,128,128,0.2); font-size:7.5px; font-weight:600; }
  .kbd { display:flex; flex-direction:column; gap:2px; flex:1; justify-content:center; }
  .krow { display:flex; gap:2px; }
  .k { flex:1; text-align:center; padding:3px 1px; border-radius:4px; font-size:6.8px; font-weight:600; border:1px solid rgba(128,128,128,0.22); }
  .dpad { width:72px; height:72px; border-radius:50%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); place-items:center; font-size:8px; font-weight:700; border:1px solid rgba(128,128,128,0.28); margin:auto; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>AeroPad — 40 Distinct UI/UX Layouts &amp; Screens</h1>
    <p>Every card has a genuinely different structural layout (not just color swaps), showing Portrait + Landscape side-by-side.</p>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All (40)</button>
    <button class="filter-btn" data-filter="Home">Home &amp; Connect (6)</button>
    <button class="filter-btn" data-filter="Trackpad">Trackpad (9)</button>
    <button class="filter-btn" data-filter="TV Remote">Universal TV (9)</button>
    <button class="filter-btn" data-filter="Keyboard">Keyboard (8)</button>
    <button class="filter-btn" data-filter="Gamepad">Gamepad &amp; Macros (8)</button>

</header>
<main class="grid" id="gallery"></main>

const gallery = document.getElementById("gallery");
designs.forEach((d, i) => {
  const c = palettes[i % palettes.length];
  const card = document.createElement("article");
  card.className = "card";
  card.dataset.cat = d.cat;
  card.innerHTML = `
    <div class="head">
      <span class="title">${d.name}</span>
      <span class="meta">${d.cat}</span>
    </div>
    <div class="stage">
      <div class="p-frame" style="background:${c.bg};color:${c.t}">
        <div class="bar" style="background:${c.s}"><span>AeroPad</span><span class="pill" style="background:${c.a};color:#fff">HID</span></div>
        ${d.p(c)}
      </div>
      <div class="l-frame" style="background:${c.bg};color:${c.t}">
        <div class="bar" style="background:${c.s}"><span>AeroPad · ${d.cat}</span><span class="pill" style="background:${c.a};color:#fff">Connected</span></div>
        ${d.l(c)}
      </div>
    </div>`;
  gallery.appendChild(card);
});

document.getElementById("filters").addEventListener("click", (e) => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  const f = e.target.dataset.filter;
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = (f === "all" || c.dataset.cat === f) ? "flex" : "none";
  });
});
</script>
