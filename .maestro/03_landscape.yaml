# Check that the full dashboard and its live controls are reachable in landscape.
appId: com.aeropad.remote
name: 03 studio landscape
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- setOrientation: LANDSCAPE_LEFT
- assertVisible: "AeroPad"
- scrollUntilVisible:
    element:
      text: "Gamepad"
    direction: DOWN
- tapOn: "Gamepad"
- assertVisible: "Not connected"
- back
- scrollUntilVisible:
    element:
      text: "Air Mouse"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Connection health"
    direction: DOWN
- setOrientation: PORTRAIT
