# AeroPad — landscape walk.
appId: com.aeropad.remote
name: 03 landscape
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- setOrientation: LANDSCAPE_LEFT

- assertVisible: "AeroPad"
- assertVisible: "Mouse"

# Scroll to the very bottom; the Quick Tools strip must be fully reachable.
- scrollUntilVisible:
    element:
      text: "Quick tools"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Air Mouse"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Connection health"
    direction: DOWN

# Open a control screen in landscape — the gamepad is the tightest layout.
- scrollUntilVisible:
    element:
      text: "Gamepad"
    direction: UP
- tapOn: "Gamepad"
- assertVisible: "Not connected"
- back

- setOrientation: PORTRAIT
