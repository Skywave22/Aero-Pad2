# AeroPad — every control screen opens and renders its primary surface.
appId: com.aeropad.remote
name: 02 control screens
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- tapOn: "Mouse"
- assertVisible: "Not connected"
- back

- tapOn: "Keyboard"
- assertVisible: "Not connected"
- back

- scrollUntilVisible:
    element:
      text: "Gamepad"
    direction: DOWN
- tapOn: "Gamepad"
- assertVisible: "Not connected"
- back

- scrollUntilVisible:
    element:
      text: "Multimedia"
    direction: DOWN
- tapOn: "Multimedia"
- assertVisible: "Not connected"
- back

- scrollUntilVisible:
    element:
      text: "Presenter"
    direction: DOWN
- tapOn: "Presenter"
- assertVisible: "Not connected"
- back

- scrollUntilVisible:
    element:
      text: "Text & Clips"
    direction: DOWN
- tapOn: "Text & Clips"
- assertVisible: "Not connected"
- back
