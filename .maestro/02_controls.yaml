# Open shortcuts via the complete Controls library.
appId: com.aeropad.remote
name: 02 control library
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- tapOn: "Controls"
- assertVisible: "Control library"
- tapOn: "Trackpad"
- assertVisible: "TRACKPAD AREA"
- back
- tapOn: "Keyboard"
- assertVisible: "Not connected"
- back
- scrollUntilVisible:
    element:
      text: "Text & Clips"
    direction: DOWN
- tapOn: "Text & Clips"
- assertVisible: "Not connected"
- back
- scrollUntilVisible:
    element:
      text: "Gamepad"
    direction: DOWN
- tapOn: "Gamepad"
- assertVisible: "Not connected"
- back
- scrollUntilVisible:
    element:
      text: "Media remote"
    direction: DOWN
- tapOn: "Media remote"
- assertVisible: "Not connected"
- back
- scrollUntilVisible:
    element:
      text: "Presenter"
    direction: DOWN
- tapOn: "Presenter"
- assertVisible: "Not connected"
