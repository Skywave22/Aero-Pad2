# Home and all dashboard sections must remain reachable with the dock visible.
appId: com.aeropad.remote
name: 01 launch and home
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- assertVisible: "AeroPad"
- assertVisible: "Bluetooth remote"
- assertVisible: "Controls"
- assertVisible: "Mouse"
- assertVisible: "Keyboard"
- assertVisible: "Settings"
- assertNotVisible: "v3.6.1"
- scrollUntilVisible:
    element:
      text: "Custom layouts"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Connection health"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "AeroPad"
    direction: UP
