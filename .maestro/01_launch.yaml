# Studio Home, live pairing entry and all four hubs.
appId: com.aeropad.remote
name: 01 launch and studio home
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- assertVisible: "AeroPad"
- assertVisible: "Control center"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Quick controls"
    direction: DOWN
- tapOn: "View all"
- assertVisible: "Control library"
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "Studio tools"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Connection health"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Help"
    direction: DOWN
