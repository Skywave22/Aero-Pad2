# AeroPad CI — build, test, lint, and publish a signed APK.
#
# Jobs:
#   build        unit tests -> lint -> release APK -> GitHub Release
#   instrumented Compose UI test on an emulator (non-blocking: emulator
#                flakiness must never block a shippable APK)
#
# Download the APK from the run summary ("artifacts") or the Releases page.
name: Build AeroPad

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the signed APK to GitHub Releases
    # gradle.properties is tuned for a 2GB RAM machine (1280MB heap /
    # 320MB metaspace), which is not enough for Lint. Runners have 7GB, so
    # override the JVM args here; local builds keep the low-memory settings.
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # V2 A6 — Gradle build + dependency caching (big CI speedup).
      - name: Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      # FIX: GitHub's web-UI upload strips the executable bit from gradlew
      # ("Permission denied", exit 126). Restore it before any gradle call.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Fail fast on the class of bug that shipped in v3.5.0: a ViewModel
      # that throws from its constructor crashed every control screen.
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # V2 A6 — lint gate: serious issues fail the build.
      - name: Lint (fatal on error)
        run: ./gradlew lintDebug

      # ------------------------------------------------------------------
      # Round 13 — release signing preflight.
      #
      # v3.6.0 builds were shipping signed with CN=Android Debug while the
      # v3.4.0/v3.5.0 releases used the real AeroPad key, because this workflow
      # silently falls back to debug signing when the keystore secret is
      # absent — and then skipped publication, so nothing was released and
      # nobody noticed. Now the run says so loudly, in the annotation and the
      # job summary, instead of producing a quietly unusable "release".
      # ------------------------------------------------------------------
      - name: Check release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # Explicit ifs, not `[ -z ] && ...`: Actions runs bash with -e, so a
          # false test as the last command of an && list fails the step.
          MISSING=""
          if [ -z "$KEYSTORE_B64" ]; then MISSING="$MISSING KEYSTORE_B64"; fi
          if [ -z "$KEYSTORE_PASS" ]; then MISSING="$MISSING KEYSTORE_PASS"; fi
          if [ -z "$KEY_ALIAS" ]; then MISSING="$MISSING KEY_ALIAS"; fi
          if [ -z "$KEY_PASS" ]; then MISSING="$MISSING KEY_PASS"; fi

          # A key committed to the repo (keys/release/) also counts as signing
          # material — see keys/release/README.md. Secrets win when present so
          # the key can be rotated out of the repo later without touching CI.
          if [ -f keys/release/keystore.properties ]; then
            echo "Repo keystore found at keys/release/ (secrets, if any, take priority)."
            HAVE_REPO_KEY=yes
          else
            HAVE_REPO_KEY=no
          fi

          if [ -n "$MISSING" ] && [ "$HAVE_REPO_KEY" = "no" ]; then
            echo "::error title=Release signing is NOT configured::Missing repository secrets:$MISSING. This build will be DEBUG-signed, cannot be installed over an existing AeroPad install, and will NOT be published. See docs/SIGNING.md."
            {
              echo "## :warning: Release signing is NOT configured"
              echo ""
              echo "Missing secrets: \`$MISSING\`"
              echo ""
              echo "This run produces a **DEBUG-signed** APK. It cannot be installed"
              echo "over an existing AeroPad install and is not published as a release."
              echo "See \`docs/SIGNING.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          elif [ "$HAVE_REPO_KEY" = "yes" ] && [ -n "$MISSING" ]; then
            echo "## :white_check_mark: Release keystore present (committed at keys/release/)" >> "$GITHUB_STEP_SUMMARY"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=repo" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aeropad-release.p12"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/aeropad-release.p12" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "## :white_check_mark: Release keystore present (repository secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "KEY_SOURCE=secrets" >> "$GITHUB_ENV"
          fi

      - name: Assemble release
        run: |
          # When the keystore is present the debug fallback is a hard error,
          # so a "signed" build can never quietly degrade.
          if [ "$SIGNED" = "true" ]; then
            export REQUIRE_RELEASE_SIGNING=1
          fi
          ./gradlew assembleRelease

      # ------------------------------------------------------------------
      # Round 13 — prove what actually signed the APK.
      #
      # The old gate trusted an env var; this reads the certificate out of the
      # finished APK, publishes the fingerprint in the job summary, and fails
      # if a build we believe is signed turns out to carry the debug key.
      # ------------------------------------------------------------------
      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "APK: $APK"
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt | head -12
          CN=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate DN' || echo "NO SIGNATURE")
          FP=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' || echo "-")
          echo "SIGNER_CN=$CN" >> "$GITHUB_ENV"
          {
            echo "## Signature"
            echo ""
            echo '```'
            echo "$CN"
            echo "$FP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIGNED" = "true" ] && echo "$CN" | grep -qi "Android Debug"; then
            echo "::error::Build was expected to be release-signed but carries the DEBUG key."
            exit 1
          fi
          if [ "$SIGNED" = "true" ] && echo "$CN" | grep -q "NO SIGNATURE"; then
            echo "::error::Release APK is not signed at all."
            exit 1
          fi

      # Round 13 — a debug-signed build must not be mistakable for a release.
      # Asset names match the v3.4.0 wording (AeroPad-v<ver>-release.apk).
      - name: Name the APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ "$SIGNED" = "true" ]; then
            NEW="app/build/outputs/apk/release/AeroPad-v$VER-release.apk"
          else
            NEW="app/build/outputs/apk/release/AeroPad-v$VER-DEBUG-SIGNED.apk"
          fi
          mv "$APK" "$NEW"
          echo "APK_PATH=$NEW" >> "$GITHUB_ENV"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          ls -la app/build/outputs/apk/release/

      - name: APK size report
        run: |
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "## APK size: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          du -b "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeropad-release
          path: app/build/outputs/apk/release/*.apk

      # Publish to GitHub Releases — only a genuinely release-signed APK, and
      # only after the certificate check above has passed.
      - name: Publish GitHub Release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AeroPad v${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: ${{ env.APK_PATH }}

  # M8 — the Compose UI test existed but never ran anywhere. It needs an
  # emulator, which is slow and occasionally flaky, so this job is allowed
  # to fail without blocking the APK in the `build` job.
  instrumented:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            set -x
            mkdir -p ui-screenshots
            # Build + install by hand instead of using connectedAndroidTest:
            # that Gradle task uninstalls the app afterwards, which destroys the
            # screenshots in app-private storage before they can be pulled.
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Match a real 6.5" phone (720x1600 px @ 2x = 360x800 dp), so the
            # landscape pass runs at 800x360 dp like the device users report on.
            # The size must be given PORTRAIT-first: rotating a display that is
            # already landscape-shaped yields a portrait screenshot.
            adb shell wm size 720x1600 || true
            adb shell wm density 320 || true
            # Only the screenshot tour: HomeScreenUiTest needs Compose idleness,
            # which this live-HID app never reaches.
            adb shell am instrument -w -e class com.aeropad.remote.ScreenshotTourTest com.aeropad.remote.test/com.aeropad.remote.HiltTestRunner | tee /tmp/inst.log || true
            # Round 14 — feature audit: every screen, every tappable control,
            # both orientations. Reports findings instead of failing so one
            # broken screen cannot hide the other twenty-two.
            adb shell am instrument -w -e class com.aeropad.remote.FeatureAuditTest com.aeropad.remote.test/com.aeropad.remote.HiltTestRunner | tee /tmp/audit.log || true
            # collect the audit's own evidence folder independently of the test
            # process exiting cleanly
            sleep 2
            grep -E "OK|FAILURES|Tests run" /tmp/inst.log | tail -5 || true
            echo "---- files written by the test ----"
            adb shell run-as com.aeropad.remote ls -la files/tour || true
            adb exec-out run-as com.aeropad.remote tar cf - files/tour > /tmp/tour.tar || true
            tar xf /tmp/tour.tar -C ui-screenshots && echo "tar extracted"
            find ui-screenshots -name '*.png' -exec mv {} ui-screenshots/ \; || true
            adb shell screencap -p /sdcard/fallback-home.png || true
            adb pull /sdcard/fallback-home.png ui-screenshots/ || true
            # Keep the raw instrumentation output: the tour is best-effort and
            # a silently skipped screen (an unreachable tap) is invisible in the
            # screenshots alone.
            cp /tmp/inst.log ui-screenshots/instrumentation.log || true
            cp /tmp/audit.log ui-screenshots/audit.log || true
            adb exec-out run-as com.aeropad.remote tar cf - files/audit > /tmp/audit.tar || true
            tar xf /tmp/audit.tar -C ui-screenshots && echo "audit extracted" || true
            find ui-screenshots -path '*audit*' -name '*.png' -exec mv {} ui-screenshots/ \; || true
            echo "---- findings ----"
            cat ui-screenshots/files/audit/findings.txt 2>/dev/null || echo "(no findings file)"
            ls -la ui-screenshots

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
