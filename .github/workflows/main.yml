# AeroPad CI — build, test, lint, and publish a signed APK.
#
# Jobs:
#   build        unit tests -> lint -> release APK -> GitHub Release
#   instrumented Compose UI test on an emulator (non-blocking: emulator
#                flakiness must never block a shippable APK)
#
# Download the APK from the run summary ("artifacts") or the Releases page.
name: Build AeroPad

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the signed APK to GitHub Releases
    # gradle.properties is tuned for a 2GB RAM machine (1280MB heap /
    # 320MB metaspace), which is not enough for Lint. Runners have 7GB, so
    # override the JVM args here; local builds keep the low-memory settings.
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # V2 A6 — Gradle build + dependency caching (big CI speedup).
      - name: Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      # FIX: GitHub's web-UI upload strips the executable bit from gradlew
      # ("Permission denied", exit 126). Restore it before any gradle call.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Fail fast on the class of bug that shipped in v3.5.0: a ViewModel
      # that throws from its constructor crashed every control screen.
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # V2 A6 — lint gate: serious issues fail the build.
      - name: Lint (fatal on error)
        run: ./gradlew lintDebug

      - name: Assemble release
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Release key lives ONLY in encrypted secrets — never in git,
            # never in logs (secret values are masked by Actions).
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aeropad-release.p12"
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/aeropad-release.p12"
            export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASS"
            ./gradlew assembleRelease
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets - building with fallback (debug) signing"
            ./gradlew assembleRelease
          fi

      # V2 A6 - APK size tracking (job summary each run).
      - name: APK size report
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "## APK size: $SIZE" >> $GITHUB_STEP_SUMMARY
          du -b "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeropad-release
          path: app/build/outputs/apk/release/*.apk

      - name: Resolve version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      # Publish to GitHub Releases — only for properly signed builds, so a
      # debug-signed fallback never lands on the public release page.
      - name: Publish GitHub Release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AeroPad v${{ env.VERSION }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

  # M8 — the Compose UI test existed but never ran anywhere. It needs an
  # emulator, which is slow and occasionally flaky, so this job is allowed
  # to fail without blocking the APK in the `build` job.
  instrumented:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
